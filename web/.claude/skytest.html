<!doctype html>
<!-- Isolated sky viewer. Not part of the sim: it renders sim/sky.js on its own,
     with a camera you can aim exactly, so the background can be judged without
     a scene, a mesh or a black hole in front of it. -->
<html><head><meta charset="utf-8"><title>sky test</title>
<style>body{margin:0;background:#000;overflow:hidden}
#hud{position:fixed;left:8px;top:8px;color:#8af;font:11px monospace;z-index:9;line-height:1.6}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
</head><body>
<div id="hud"></div>
<script type="module">
import * as THREE from 'three';
import { createSkyBackdrop, applySkyBand, applySkyEnvironment, applySkyOptics, SKY_ENVIRONMENTS } from '../sim/sky.js';
import { BANDS } from '../sim/spectrum.js';
import { createPostFX } from '../sim/postfx.js';

// preserveDrawingBuffer so probe() can readPixels after the frame has finished
const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
document.body.appendChild(renderer.domElement);
const postfx = createPostFX(renderer);

const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
const backdrop = createSkyBackdrop();

// yaw/pitch aim, so a given direction can be revisited exactly
let yaw = 0, pitch = 0, band = 3, envKeys = Object.keys(SKY_ENVIRONMENTS), envI = 0;
let fov = 50;

function apply() {
  applySkyEnvironment(backdrop.uniforms, { env: envKeys[envI], tilt: 0.0, roll: 0.0 });
  applySkyBand(backdrop.uniforms, band);
  postfx.setBand(band);
  hud.textContent = `env ${envKeys[envI]}   band ${BANDS[band].short}   `
    + `yaw ${(yaw*57.3).toFixed(0)}  pitch ${(pitch*57.3).toFixed(0)}  fov ${fov.toFixed(0)}`
    + `\n[1-7] band   [e] env   [arrows] aim   [z/x] zoom`;
}

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h; camera.fov = fov; camera.updateProjectionMatrix();
  postfx.setSize(w, h);
  backdrop.uniforms.aspect.value = w / h;
  applySkyOptics(backdrop.uniforms, { fov: fov * Math.PI / 180, height: h });
}
addEventListener('resize', resize);

addEventListener('keydown', e => {
  const n = +e.key;
  if (n >= 1 && n <= 7) band = n - 1;
  else if (e.key === 'e') envI = (envI + 1) % envKeys.length;
  else if (e.key === 'ArrowLeft')  yaw -= 0.12;
  else if (e.key === 'ArrowRight') yaw += 0.12;
  else if (e.key === 'ArrowUp')    pitch = Math.min(1.5, pitch + 0.1);
  else if (e.key === 'ArrowDown')  pitch = Math.max(-1.5, pitch - 0.1);
  else if (e.key === 'z') { fov = Math.max(2, fov / 1.4); resize(); }
  else if (e.key === 'x') { fov = Math.min(90, fov * 1.4); resize(); }
  else return;
  apply();
});

// exposed so a test harness can aim without keyboard events
window.U = backdrop.uniforms;
window.probe = () => {                       // centre-pixel colour, post tone map
  renderer.setRenderTarget(null);            // read the canvas, not postfx's target
  const gl = renderer.getContext();
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  const px = new Uint8Array(4);
  gl.readPixels(gl.drawingBufferWidth >> 1, gl.drawingBufferHeight >> 1,
                1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
  return [px[0], px[1], px[2]];
};
// Synchronous single-frame sample: set uniform overrides, render, read the
// centre pixel, restore. Everything in one call so an automation harness never
// has to wait for a frame.
window.sample = (overrides = {}, atYaw = yaw, atPitch = pitch) => {
  const saved = {};
  for (const k in overrides) { saved[k] = U[k].value; U[k].value = overrides[k]; }
  const y0 = yaw, p0 = pitch; yaw = atYaw; pitch = atPitch;
  drawFrame();
  const px = probe();
  for (const k in saved) U[k].value = saved[k];
  yaw = y0; pitch = p0;
  return px;
};
window.aim = (y, p) => { yaw = y; pitch = p; apply(); };
window.setBand = b => { band = b; apply(); };
window.setEnv = k => { envI = Math.max(0, envKeys.indexOf(k)); apply(); };

function drawFrame() {
  camera.position.set(0, 0, 0);
  camera.rotation.set(0, 0, 0, 'YXZ');
  camera.rotateY(yaw); camera.rotateX(pitch);
  camera.updateMatrixWorld(true);
  backdrop.uniforms.camMat.value.copy(camera.matrixWorld);
  backdrop.uniforms.fov.value = fov * Math.PI / 180;
  renderer.setRenderTarget(postfx.hdr); renderer.clear();
  renderer.render(backdrop.scene, backdrop.camera);
  postfx.render(1.0, performance.now() * 1e-3);
}
function loop() { requestAnimationFrame(loop); drawFrame(); }
resize(); apply(); loop();
</script></body></html>
